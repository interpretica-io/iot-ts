# The engine and the agent are built for the same platform: the agent runs
# on the engine host. Every library in this suite works through a job
# factory (or an RPC server on the agent), and both need an agent, so the
# suite has a real one.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# --------------------------------------------------------------------------
# The external tsf-* libraries this suite covers. Their references live in
# conf/external.yml and the commits actually built in conf/builder.conf.lock.
#
# The foundation chain is built first: tapi_kernel on tapi_devtool,
# tapi_cybersec on tapi_kernel. Every audit module (mqtt, coap, lorawan,
# ieee802154, mdns, bt, ics, fuzz, tls) reports through
# tapi_cybersec's finding model, so the chain is pulled in engine-side.
# --------------------------------------------------------------------------
TE_EXT_REPO_USE([tsf_devtool],  [], [tapi_devtool])
TE_EXT_REPO_USE([tsf_kernel],   [], [tapi_kernel])
TE_EXT_REPO_USE([tsf_cybersec], [], [tapi_cybersec])

# The cross-cutting security layer: fuzzing frame parsers, a fake clock.
TE_EXT_REPO_USE([tsf_fuzz],     [], [tapi_fuzz])
TE_EXT_REPO_USE([tsf_tls],      [], [tapi_tls])
TE_EXT_REPO_USE([tsf_time],     [], [tapi_time])

# Engine-side protocol TAPIs (drive a tool / pure codec; no agent lib).
TE_EXT_REPO_USE([tsf_mqtt],     [], [tapi_mqtt])
TE_EXT_REPO_USE([tsf_lorawan],  [], [tapi_lorawan])
TE_EXT_REPO_USE([tsf_802154],   [], [tapi_802154])
TE_EXT_REPO_USE([tsf_bluetooth],[], [tapi_bt])
TE_EXT_REPO_USE([tsf_cwmp],     [], [tapi_cwmp])

# Agent-side modules: each ships ta_<x> (the implementation) and
# rpcs_<x> (its RPCs), linked into the RPC server application below, plus
# tapi_<x> on the engine. Their *_rpc.x.m4 are registered with rpcxdr.
TE_EXT_REPO_USE([tsf_coap],     [], [ta_coap rpcs_coap tapi_coap])
TE_EXT_REPO_USE([tsf_mdns],     [], [ta_mdns rpcs_mdns tapi_mdns])
TE_EXT_REPO_USE([tsf_ics],      [], [ta_ics rpcs_ics tapi_ics])
TE_EXT_REPO_USE([tsf_gpio],     [], [ta_gpio rpcs_gpio tapi_gpio])
TE_EXT_REPO_USE([tsf_sensors],  [], [ta_sensors rpcs_sensors tapi_sensors])
TE_EXT_REPO_USE([tsf_watchdog], [], [ta_watchdog rpcs_watchdog tapi_watchdog])

# WiFi configuration subtree (tsf-wifi): the TAPI and the Configurator
# model on the engine; the agent-side implementation is built only for a
# dedicated WiFi agent (TE_AGENT_BUILD at the bottom), which stays inert
# on localhost where TA_WIFI_A_HOST is unset.
TE_EXT_REPO_USE([tsf_wifi],     [], [tapi_cfg_wifi])

# Every agent-side RPC definition is registered with the engine rpcxdr so
# the generated client stubs exist. tarpc_job is TE's own; the rest come
# from the ta_<x> dirs of the external repositories.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4,../ta_coap/coap_rpc.x.m4,../ta_mdns/mdns_rpc.x.m4,../ta_ics/ics_rpc.x.m4,../ta_gpio/gpio_rpc.x.m4,../ta_sensors/sensors_rpc.x.m4,../ta_watchdog/watchdog_rpc.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# The traffic rules of tapi_sniffrules (used by tapi_cybersec) capture TCP
# and UDP over IPv4/IPv6 on an Ethernet interface.
TE_LIB_PARMS([tapi_tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# The agent side of the traffic engine takes the same protocol list.
TE_LIB_PARMS([tad], [], [],
             [--with-arp --with-eth --with-ipstack \
              --with-forw --with-socket])

# One Test Agent of the stock unix flavour (the localhost DUT).
TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# The RPC server application. Every agent-side module's ta_<x> + rpcs_<x>
# link here on top of the stock RPC server, so their RPCs run on the
# agent. The native libraries each ta_<x> needs are installed by
# build.sh --extra-deps (libcoap v3 is built from source there; the rest
# are distro packages).
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [ta_coap rpcs_coap \
           ta_mdns rpcs_mdns \
           ta_ics rpcs_ics \
           ta_gpio rpcs_gpio \
           ta_sensors rpcs_sensors \
           ta_watchdog rpcs_watchdog \
           conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh --extra-deps='libpcre2-8,libcoap-3-openssl,avahi-client,libmodbus,libgpiod,libsensors'],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper

dnl Build a Test Agent for a WiFi host named by the environment variable
dnl passed as the only argument. On localhost the variable is unset, so
dnl this expands to nothing and no WiFi agent is built - the wifi group
dnl then finds no /agent/wifi subtree and skips.
define([TE_AGENT_BUILD], [
    if test -n "${$1}" -o -n "${$1_BUILD_HOST}" -o "${$1_BUILD}" = local ; then
        if ! te_is_in_list "${$1_TA_TYPE}" $TE_BS_PLATFORMS ; then
            te_ta_type_as_platform "$1"

            case "${$1_TA_TYPE}" in
                *aarch64*) TE_TA_HOST=aarch64-pc-linux ;;
                *64*)      TE_TA_HOST=x86_64-pc-linux ;;
                *)         TE_TA_HOST=i386-pc-linux ;;
            esac

            TE_AGENT_BUILD_CC=${$1_CC}
            TE_AGENT_BUILD_CFLAGS=${$1_CFLAGS}
            test -n "$TE_AGENT_BUILD_CC" && \
                TE_AGENT_BUILD_CC="CC=$TE_AGENT_BUILD_CC"

            TE_PLATFORM_BUILD([${$1_TA_TYPE}], [])
            TE_PLATFORM([${$1_TA_TYPE}], [$TE_AGENT_BUILD_CC],
                        [$TE_AGENT_BUILD_CFLAGS -D_GNU_SOURCE],
                        [-D_GNU_SOURCE], [],
                        [logger_core tools conf_oid rpcxdr rpc_types asn ndn \
                         comm_net_agent loggerta rpctransport agentlib \
                         rcfpch rpcserver tad netconf ta_job rpcs_job \
                         tapi_cfg_wifi ta_wifi],
                        [${$1_BUILD}])

            TE_EXT_REPO_USE([tsf_wifi], [${$1_TA_TYPE}], [])

            TE_LIB_PARMS([tad], [${$1_TA_TYPE}], [],
                         [--with-arp --with-eth --with-ipstack \
                          --with-forw --with-socket])

            TE_LIB_PARMS([rpcxdr], [${$1_TA_TYPE}], [],
                         [--with-rpcdefs=tarpc_job.x.m4])

            TE_TA_TYPE([${$1_TA_TYPE}], [${$1_TA_TYPE}], [unix],
                       [--with-rcf-rpc --with-libnetconf \
                        --with-8021x --with-wifi],
                       [], [], [],
                       [comm_net_agent rcfpch tapi_cfg_wifi ta_wifi])

            TE_TA_APP([ta_rpcprovider], [${$1_TA_TYPE}], [${$1_TA_TYPE}],
                      [ta_rpcprovider], [], [],
                      [conf_oid ta_job comm_net_agent rpcs_job rpcserver \
                       agentlib rpcxdrta rpc_types rpctransport loggerta \
                       tools logger_core netconf],
                      [\${EXT_SOURCES}/build.sh --extra-deps='libpcre2-8'],
                      [ta_rpcs], [])
        fi
    fi
])

TE_AGENT_BUILD([TA_WIFI_A_HOST])
